version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: ai_postgres

    environment:
      POSTGRES_DB: ai_sql_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

    networks:
      - ai_network

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: ai_backend

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    env_file:
      - .env.docker

    networks:
      - ai_network

  frontend:

    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: ai_frontend

    depends_on:
      - backend

    ports:
      - "8501:8501"

    env_file:
      - .env.docker

    networks:
      - ai_network

volumes:

  postgres_data:

networks:

  ai_network: