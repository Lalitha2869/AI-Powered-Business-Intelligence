name: AI-SQL-Assistant CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

# ==========================================
# 1. VALIDATION STAGE
# ==========================================

  validation:

    name: Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Python Syntax Check
        run: |
          python -m py_compile backend/main.py

# ==========================================
# 2. TESTING STAGE
# ==========================================

  testing:

    name: Testing

    runs-on: ubuntu-latest

    needs: validation

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/ || true

# ==========================================
# 3. SECURITY STAGE
# ==========================================

  security:

    name: Security Scan

    runs-on: ubuntu-latest

    needs: testing

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Security Scan
        run: |
          bandit -r backend/ || true

# ==========================================
# 4. BACKEND BUILD
# ==========================================

  build-backend:

    name: Build Backend Image

    runs-on: ubuntu-latest

    needs: security

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Docker Image
        run: |
          docker build \
          -f docker/backend.Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/ai-sql-backend:latest .

# ==========================================
# 5. FRONTEND BUILD
# ==========================================

  build-frontend:

    name: Build Frontend Image

    runs-on: ubuntu-latest

    needs: security

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Docker Image
        run: |
          docker build \
          -f docker/frontend.Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/ai-sql-frontend:latest .

# ==========================================
# 6. PUSH BACKEND
# ==========================================

  push-backend:

    name: Push Backend Image

    runs-on: ubuntu-latest

    needs: build-backend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Backend Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/ai-sql-backend:latest

# ==========================================
# 7. PUSH FRONTEND
# ==========================================

  push-frontend:

    name: Push Frontend Image

    runs-on: ubuntu-latest

    needs: build-frontend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Frontend Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/ai-sql-frontend:latest

# ==========================================
# 8. DEPLOYMENT
# ==========================================

  deployment:

    name: Railway Deployment

    runs-on: ubuntu-latest

    needs:
      - push-backend
      - push-frontend

    steps:

      - name: Deployment Info
        run: |
          echo "Docker images pushed successfully"
          echo "Railway Auto Deployment Triggered"

# ==========================================
# 9. HEALTH CHECK
# ==========================================

  health-check:

    name: Health Check

    runs-on: ubuntu-latest

    needs: deployment

    steps:

      - name: Wait For Deployment
        run: sleep 30

      - name: Health Check
        run: |
          echo "Application deployed successfully"