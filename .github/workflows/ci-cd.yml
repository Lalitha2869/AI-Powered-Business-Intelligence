name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: |
          docker build -f Dockerfile.backend -t ${{ secrets.DOCKER_USERNAME }}/ai-backend:latest .

      - name: Build Frontend
        run: |
          docker build -f Dockerfile.frontend -t ${{ secrets.DOCKER_USERNAME }}/ai-frontend:latest .

      - name: Push Backend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-backend:latest

      - name: Push Frontend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-frontend:latest