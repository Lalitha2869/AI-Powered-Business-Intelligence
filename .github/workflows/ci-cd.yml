name: AI-Powered-Business-Intelligence CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

# ==========================================
# 1. VALIDATION
# ==========================================

  validation:
    name: Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Python Syntax Validation
        run: |
          python -m py_compile backend/main.py

# ==========================================
# 2. TESTING
# ==========================================

  testing:
    name: Testing
    runs-on: ubuntu-latest
    needs: validation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/
          else
            echo "No tests folder found"
          fi

# ==========================================
# 3. SECURITY SCAN
# ==========================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: testing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Security Scan
        run: |
          bandit -r backend/ -ll

# ==========================================
# 4. BACKEND BUILD & PUSH
# ==========================================

  backend:
    name: Backend Build & Push
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build \
          -f Dockerfile.backend \
          -t ${{ secrets.DOCKER_USERNAME }}/ai-backend:latest .

      - name: Push Backend Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/ai-backend:latest

# ==========================================
# 5. FRONTEND BUILD & PUSH
# ==========================================

  frontend:
    name: Frontend Build & Push
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build \
          -f Dockerfile.frontend \
          -t ${{ secrets.DOCKER_USERNAME }}/ai-frontend:latest .

      - name: Push Frontend Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/ai-frontend:latest

# ==========================================
# 6. DEPLOYMENT VERIFICATION
# ==========================================

  deployment:
    name: Docker Deployment Verification
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Deployment Status
        run: |
          echo "Backend Docker image pushed successfully"
          echo "Frontend Docker image pushed successfully"
          echo "Docker deployment artifacts ready"

# ==========================================
# 7. HEALTH CHECK
# ==========================================

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deployment

    steps:
      - name: Verify Images
        run: |
          echo "Backend Image:"
          echo "${{ secrets.DOCKER_USERNAME }}/ai-backend:latest"

          echo "Frontend Image:"
          echo "${{ secrets.DOCKER_USERNAME }}/ai-frontend:latest"

          echo "Pipeline completed successfully"